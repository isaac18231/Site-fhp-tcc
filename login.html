<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Login | FHP Fibra</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<main class="login-wrap">
<section class="login-intro"><a class="brand" href="index.html"><span>FHP</span> FIBRA</a>
<div class="intro-text">
<p class="eyebrow">ÁREA DEMONSTRATIVA</p>
<h1>Sua conexão, em um só lugar.</h1>
<p>Acesse serviços, informações de plano e solicitações demonstrativas.</p>
<ul class="intro-list">
<li>Consulte seu plano</li>
<li>Acompanhe solicitações</li>
<li>Gerencie seus dados</li>
</ul>
</div>
<div class="login-lines" aria-hidden="true">
</div>
</section>
<section class="login-card"><a class="back" href="index.html">← Voltar ao site</a>
<div class="login-title"><span class="lock" aria-hidden="true">♙</span>
<h2>Bem-vindo de volta</h2>
<p>Entre com seu e-mail e senha.</p>
</div>
<form id="login-form" novalidate><label for="usuario">E-mail<span class="field"><i class="ico">✉</i><input id="usuario" name="usuario" type="email" required autocomplete="username" placeholder="voce@exemplo.com"></span></label><label for="senha">Senha<span class="field password-wrap"><i class="ico">🔑</i><input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="Digite sua senha"><button type="button" class="show-password" aria-label="Mostrar senha">👁</button></span></label>
<p class="login-feedback" role="alert" aria-live="polite">
</p><button class="btn btn-primary btn-login" type="submit">Entrar</button><a class="text-action" id="create-account-link" href="cadastro.html">Criar conta</a>
</form>
</section>
</main><script src="js/fhp.js"></script><script src="js/login.js"></script>
</body>
</html>
