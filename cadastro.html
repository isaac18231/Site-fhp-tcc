<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | FHP Fibra</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<main class="login-wrap signup-wrap">
<section class="login-intro"><a class="brand" href="index.html"><span>FHP</span> FIBRA</a>
<div class="intro-text">
<p class="eyebrow">ÁREA DEMONSTRATIVA</p>
<h1>Crie sua conta.</h1>
<p>Tenha seus dados, plano e solicitações sempre à mão.</p>
<ul class="intro-list">
<li>Acompanhe seu plano</li>
<li>Converse com o atendimento</li>
<li>Gerencie seus dados</li>
</ul>
</div>
<div class="login-lines" aria-hidden="true">
</div>
</section>
<section class="login-card"><a class="back" href="index.html">← Voltar ao site</a>
<div class="login-title"><span class="lock" aria-hidden="true">♙</span>
<h2>Criar conta</h2>
<p>Preencha seus dados para começar.</p>
</div>
<form id="register-form" class="signup-form" novalidate><label>Nome completo<input name="nome" required autocomplete="name"></label>
<div class="form-row"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Telefone<input name="telefone" required autocomplete="tel"></label>
</div>
<div class="form-row"><label>CPF<input name="cpf" required inputmode="numeric"></label><label>Endereço<input name="endereco" required autocomplete="street-address"></label>
</div>
<div class="form-row"><label>Senha<input name="senha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmar" type="password" required autocomplete="new-password"></label>
</div>
<p class="login-feedback" role="alert" aria-live="polite">
</p><button class="btn btn-primary btn-login" type="submit">Criar minha conta</button><a class="text-action" href="login.html">Já tenho uma conta</a>
</form>
</section>
</main><script src="js/fhp.js"></script><script src="js/cadastro.js"></script>
</body>
</html>
